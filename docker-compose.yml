services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-runner
    container_name: cookie-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - PORT=8000
    networks:
      - cookie-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-runner
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: cookie-frontend
    ports:
      - "${FRONTEND_PORT:-3050}:3000"
    stdin_open: true
    tty: true
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    networks:
      - cookie-network
    restart: unless-stopped

networks:
  cookie-network:
    driver: bridge
